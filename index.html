<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>時計とカレンダー</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="icon-192.png">
<style>
  /* Android 5.1 の古いブラウザでも動くよう、Flexbox と ES5 のみで作成 */
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
  body {
    background: #000; color: #fff;
    font-family: "Roboto", "Noto Sans CJK JP", "Noto Sans JP", sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-transition: color 2s, background 2s; transition: color 2s, background 2s;
  }
  #wrap {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    display: -webkit-flex; display: flex;
    -webkit-align-items: center; align-items: center;
    padding: 4vh 4vw; box-sizing: border-box;
    -webkit-transition: -webkit-transform 1s; transition: transform 1s;
  }
  .panel {
    height: 100%; box-sizing: border-box; border-radius: 4vh;
    display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column;
    -webkit-justify-content: center; justify-content: center;
  }
  #left  { -webkit-flex: 1.25; flex: 1.25; padding: 0 2vw; }
  #right { -webkit-flex: 1; flex: 1; padding: 3vh 2.5vw; background: #1c1c1e; margin-left: 3vw; }

  #time { font-weight: 200; font-size: 30vh; line-height: 1; letter-spacing: -0.5vh; white-space: nowrap; }
  #sec  { font-size: 8vh; font-weight: 300; color: #8e8e93; margin-left: 1vw; }
  #date { font-size: 6.2vh; font-weight: 400; margin-top: 3vh; }
  #sub  { font-size: 3.6vh; color: #8e8e93; margin-top: 1.2vh; }
  #batt { font-size: 3vh; color: #8e8e93; margin-top: 4vh; }

  #mon  { font-size: 5vh; font-weight: 500; margin-bottom: 2vh; }
  #mon span { color: #ff453a; }
  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  th { font-size: 2.8vh; font-weight: 400; color: #8e8e93; padding-bottom: 1.2vh; }
  td { font-size: 3.9vh; text-align: center; height: 8vh; }
  td.sun, th.sun, td.hol { color: #ff453a; }
  td.sat, th.sat { color: #64a8ff; }
  td .today {
    display: inline-block; width: 6.4vh; height: 6.4vh; line-height: 6.4vh;
    border-radius: 50%; background: #ff453a; color: #fff; font-weight: 600;
  }
  #holi { font-size: 2.7vh; line-height: 1.5; color: #8e8e93; margin-top: 1.5vh; min-height: 3vh; }

  /* ---- 夜間モード：黒地に薄い赤橙だけで表示 ---- */
  body.night { color: #ff5a1f; }
  body.night #wrap { opacity: 0.38; }
  body.night #right { background: transparent; }
  body.night #sec, body.night #sub, body.night #batt, body.night th, body.night #holi,
  body.night td.sun, body.night td.sat, body.night td.hol, body.night th.sun, body.night th.sat,
  body.night #mon span { color: #ff5a1f; }
  body.night td .today { background: #ff5a1f; color: #000; }
  body.night #sec { display: none; }
</style>
</head>
<body>
<div id="wrap">
  <div id="left" class="panel">
    <div><span id="time">--:--</span><span id="sec">--</span></div>
    <div id="date"></div>
    <div id="sub"></div>
    <div id="batt"></div>
  </div>
  <div id="right" class="panel">
    <div id="mon"></div>
    <table id="cal"></table>
    <div id="holi"></div>
  </div>
</div>

<script>
/* ===== 設定 ===== */
var NIGHT_START = 22;   // 夜間モード開始（時）
var NIGHT_END   = 6;    // 夜間モード終了（時）
var DAY_BRIGHT  = 120;  // 昼の画面の明るさ（Fully Kiosk Browser 使用時のみ。0〜255）
var NIGHT_BRIGHT = 5;   // 夜の画面の明るさ

/* 祝日（2026〜2027年。内閣府の公表に基づく） */
var HOLIDAYS = {
  "2026-01-01":"元日","2026-01-12":"成人の日","2026-02-11":"建国記念の日","2026-02-23":"天皇誕生日",
  "2026-03-20":"春分の日","2026-04-29":"昭和の日","2026-05-03":"憲法記念日","2026-05-04":"みどりの日",
  "2026-05-05":"こどもの日","2026-05-06":"振替休日","2026-07-20":"海の日","2026-08-11":"山の日",
  "2026-09-21":"敬老の日","2026-09-22":"国民の休日","2026-09-23":"秋分の日","2026-10-12":"スポーツの日",
  "2026-11-03":"文化の日","2026-11-23":"勤労感謝の日",
  "2027-01-01":"元日","2027-01-11":"成人の日","2027-02-11":"建国記念の日","2027-02-23":"天皇誕生日",
  "2027-03-21":"春分の日","2027-03-22":"振替休日","2027-04-29":"昭和の日","2027-05-03":"憲法記念日",
  "2027-05-04":"みどりの日","2027-05-05":"こどもの日","2027-07-19":"海の日","2027-08-11":"山の日",
  "2027-09-20":"敬老の日","2027-09-23":"秋分の日","2027-10-11":"スポーツの日","2027-11-03":"文化の日",
  "2027-11-23":"勤労感謝の日"
};
var WD = ["日","月","火","水","木","金","土"];
var forced = null;      // 画面タップで昼/夜を手動切替（null=自動）
var lastDay = -1, lastNight = null, battText = "";

function pad(n) { return (n < 10 ? "0" : "") + n; }
function key(y, m, d) { return y + "-" + pad(m) + "-" + pad(d); }
function $(id) { return document.getElementById(id); }

/* 祝日データを最新化（失敗しても内蔵データで動作） */
function refreshHolidays() {
  try {
    var x = new XMLHttpRequest();
    x.open("GET", "https://holidays-jp.github.io/api/v1/date.json", true);
    x.onload = function () {
      try { var j = JSON.parse(x.responseText); for (var k in j) HOLIDAYS[k] = j[k].replace(/^.* 振替休日$/, "振替休日"); lastDay = -1; } catch (e) {}
    };
    x.send();
  } catch (e) {}
}

function drawCalendar(now) {
  var y = now.getFullYear(), m = now.getMonth() + 1, d = now.getDate();
  $("mon").innerHTML = m + "月 <span>" + y + "</span>";
  var first = new Date(y, m - 1, 1).getDay();
  var days = new Date(y, m, 0).getDate();
  var h = "<tr>";
  for (var i = 0; i < 7; i++) h += "<th class='" + (i == 0 ? "sun" : i == 6 ? "sat" : "") + "'>" + WD[i] + "</th>";
  h += "</tr><tr>";
  for (i = 0; i < first; i++) h += "<td></td>";
  for (var day = 1; day <= days; day++) {
    var col = (first + day - 1) % 7, cls = col == 0 ? "sun" : col == 6 ? "sat" : "";
    if (HOLIDAYS[key(y, m, day)]) cls = "hol";
    h += "<td class='" + cls + "'>" + (day == d ? "<span class='today'>" + day + "</span>" : day) + "</td>";
    if (col == 6 && day < days) h += "</tr><tr>";
  }
  $("cal").innerHTML = h + "</tr>";

  /* 今日以降の祝日を2件表示 */
  var list = [], ks = [];
  for (var k in HOLIDAYS) ks.push(k);
  ks.sort();
  var today = key(y, m, d);
  for (i = 0; i < ks.length && list.length < 2; i++) {
    if (ks[i] >= today) {
      var p = ks[i].split("-"), dt = new Date(+p[0], +p[1] - 1, +p[2]);
      list.push((+p[1]) + "/" + (+p[2]) + "(" + WD[dt.getDay()] + ") " + HOLIDAYS[ks[i]]);
    }
  }
  $("holi").innerHTML = list.length ? "次の祝日<br>" + list.join("<br>") : "";
}

function setBrightness(night) {
  /* Fully Kiosk Browser の JavaScript 機能が使える場合のみ画面の明るさを変更 */
  try { if (window.fully && fully.setScreenBrightness) fully.setScreenBrightness(night ? NIGHT_BRIGHT : DAY_BRIGHT); } catch (e) {}
}

function tick() {
  var now = new Date(), H = now.getHours();
  var autoNight = (NIGHT_START > NIGHT_END) ? (H >= NIGHT_START || H < NIGHT_END) : (H >= NIGHT_START && H < NIGHT_END);
  var night = forced === null ? autoNight : forced;
  if (night !== lastNight) {
    document.body.className = night ? "night" : "";
    setBrightness(night); lastNight = night;
  }
  $("time").innerHTML = H + ":" + pad(now.getMinutes());
  $("sec").innerHTML = pad(now.getSeconds());
  if (now.getDate() !== lastDay) {
    lastDay = now.getDate();
    var y = now.getFullYear(), m = now.getMonth() + 1, d = now.getDate();
    $("date").innerHTML = m + "月" + d + "日 " + WD[now.getDay()] + "曜日";
    var hol = HOLIDAYS[key(y, m, d)];
    $("sub").innerHTML = y + "年（令和" + (y - 2018) + "年）" + (hol ? "　" + hol : "");
    drawCalendar(now);
  }
  /* 焼き付き防止：1分ごとに表示位置をわずかにずらす */
  if (now.getSeconds() === 0) {
    var dx = (now.getMinutes() % 5) - 2, dy = (now.getMinutes() % 3) - 1;
    $("wrap").style.webkitTransform = $("wrap").style.transform = "translate(" + dx * 6 + "px," + dy * 6 + "px)";
  }
  $("batt").innerHTML = battText;
}

/* 電池残量の表示（対応ブラウザのみ） */
function watchBattery() {
  if (!navigator.getBattery) return;
  navigator.getBattery().then(function (b) {
    function upd() { battText = "電池 " + Math.round(b.level * 100) + "%" + (b.charging ? "（充電中）" : ""); }
    upd(); b.addEventListener("levelchange", upd); b.addEventListener("chargingchange", upd);
  });
}

/* 画面タップで 自動 → 昼 → 夜 → 自動 と切り替え */
function isFull() { return document.fullscreenElement || document.webkitFullscreenElement; }
function goFull() {
  var e = document.documentElement;
  try { (e.requestFullscreen || e.webkitRequestFullscreen || e.webkitRequestFullScreen).call(e); } catch (x) {}
}
document.addEventListener("click", function () {
  /* 最初のタップでは全画面表示に切り替える（Fully Kiosk Browser がなくても全画面にできる） */
  if (!window.fully && !isFull()) { goFull(); return; }
  forced = forced === null ? false : forced === false ? true : null;
  lastNight = null; tick();
});

/* ホーム画面に追加したとき全画面で起動できるようにする */
if ("serviceWorker" in navigator) { try { navigator.serviceWorker.register("sw.js"); } catch (e) {} }
watchBattery();
refreshHolidays();
setInterval(refreshHolidays, 24 * 3600 * 1000);
tick();
setInterval(tick, 1000);
</script>
</body>
</html>
